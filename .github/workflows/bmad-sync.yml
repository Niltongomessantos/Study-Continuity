name: BMad - Sincronizar Histórias com o GitHub Projects

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  sync-issues:
    # Só executa se o PR foi integrado (merged) E a branch de origem começar com "docs/stories"
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'docs/stories')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Fazer o Checkout do Código
        uses: actions/checkout@v4

      - name: Preparar e Executar o Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Garantindo que a label 'story' existe..."
          gh label create "story" --color "0E8A16" --force || true
          
          chmod +x scripts/sync-bmad-issues.sh
          ./scripts/sync-bmad-issues.sh